<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .blue-quad { fill: #0B65A3; }
      .yellow-quad { fill: #F3C300; }
      .banner-bg { fill: #034F8B; stroke: #ffffff; stroke-width: 1.5; }
      .red-left { fill: #C51128; }
      .red-right { fill: #9A081B; }
      .white-symbol { fill: #ffffff; }
      .banner-text { font-family: "Times New Roman", Times, Georgia, serif; font-weight: 800; fill: #ffffff; font-size: 62px; letter-spacing: 3px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="500" height="500" class="bg"/>

  <g filter="url(#shadow)">
    <!-- Divider Gap Background -->
    <path fill="#ffffff" d="M 80,80 L 420,80 L 420,445 L 250,450 L 80,445 Z" />

    <!-- Top Left Blue Field -->
    <path class="blue-quad" d="M 85,90 L 245,102 L 245,232 L 95,232 Z" />

    <!-- Top Right Yellow Field -->
    <path class="yellow-quad" d="M 255,102 L 415,90 L 405,232 L 255,232 Z" />

    <!-- Tree in Blue Field -->
    <g class="white-symbol">
      <!-- Tree Trunk -->
      <path d="M 160,220 L 170,220 L 168,172 L 162,172 Z" />
      <!-- Foliage / Canopy Layers -->
      <path d="M 115,198 C 112,185 125,178 135,182 C 130,170 142,160 155,165 C 158,152 172,152 175,165 C 188,160 200,170 195,182 C 205,178 218,185 215,198 C 210,205 120,205 115,198 Z" />
      <path d="M 122,184 C 128,172 140,166 150,170 C 155,158 175,158 180,170 C 190,166 202,172 208,184 Z" />
      <path d="M 132,168 C 138,158 150,152 160,156 C 165,146 180,146 185,156 C 195,152 207,158 213,168 Z" />
      <path d="M 142,152 C 148,144 158,140 165,144 C 170,136 182,136 187,144 C 194,140 204,144 208,152 Z" />
    </g>

    <!-- Cross and Stars in Yellow Field -->
    <g class="white-symbol">
      <!-- Cross -->
      <path d="M 330,122 L 340,122 L 340,142 L 360,142 L 360,152 L 340,152 L 340,208 L 330,208 L 330,152 L 310,152 L 310,142 L 330,142 Z" />
      
      <!-- Left Star -->
      <polygon points="292,160 295,168 303,168 297,173 299,181 292,176 285,181 287,173 281,168 289,168" />
      
      <!-- Right Star -->
      <polygon points="378,160 381,168 389,168 383,173 385,181 378,176 371,181 373,173 367,168 375,168" />
    </g>

    <!-- Red Bottom Shield Base -->
    <!-- Left Red Half -->
    <path class="red-left" d="M 103,300 L 247,300 L 247,440 L 245,440 C 205,395 135,350 103,300 Z" />
    <!-- Right Red Half -->
    <path class="red-right" d="M 253,300 L 397,300 C 365,350 295,395 255,440 L 253,440 Z" />

    <!-- Center Blue Banner -->
    <rect class="banner-bg" x="82" y="228" width="336" height="76" rx="2" />
    
    <!-- DUNOR Text -->
    <text x="250" y="284" text-anchor="middle" class="banner-text">DUNOR</text>
  </g>
</svg>
