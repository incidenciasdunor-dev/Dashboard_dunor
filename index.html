<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>DASHBOARD DUNOR</title>
    <meta name="description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />

    <!-- Open Graph / Meta de Previsualización (Miniatura de página) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DASHBOARD DUNOR" />
    <meta property="og:description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />
    <meta property="og:image" content="/logo_dunor.png" />
    <meta property="og:image:secure_url" content="/logo_dunor.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DASHBOARD DUNOR" />
    <meta name="twitter:description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />
    <meta name="twitter:image" content="/logo_dunor.png" />

    <!-- Favicon e Iconos de App -->
    <link rel="icon" type="image/png" sizes="512x512" href="/logo_dunor.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="shortcut icon" href="/logo_dunor.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo_dunor.png" />
    <link rel="apple-touch-icon" href="/logo_dunor.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DASHBOARD DUNOR" />
    <meta name="theme-color" content="#4f46e5" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New service worker available, force reload
                  window.location.reload();
                }
              });
            });
          });
        });
      }
    </script>
  </body>
</html>
