<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Dashboard DUNOR</title>
    <meta name="description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />

    <!-- Open Graph / Meta de Previsualización y Miniatura para Vercel y Redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dashboard DUNOR" />
    <meta property="og:description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dashboard DUNOR" />
    <meta name="twitter:description" content="Sistema de Reporte y Gestión de Incidencias Escolares DUNOR." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Favicon e Iconos -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/jpeg" href="/logo_dunor.jpg" />
    <link rel="icon" type="image/png" href="/logo_dunor.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New service worker available, force reload
                  window.location.reload();
                }
              });
            });
          });
        });
      }
    </script>
  </body>
</html>
